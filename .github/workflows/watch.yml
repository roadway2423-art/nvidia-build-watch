# .github/workflows/watch.yml
# 주의: schedule은 저장소 "기본 브랜치"에 있어야만 동작한다 (README 참고).
name: nvidia-build-watch

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 09:00 KST (정각 cron은 지연되기 쉬움, ±수십 분 가능)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # CI 기본: Tier 2(Playwright) 끔 — 브라우저 설치 없이 Tier 1만으로 동작 (devlog 수정 #6).
      # M5(Tier 2 완성) 후 전환 방법:
      #   1) 아래 설치 단계 추가: - run: playwright install --with-deps chromium
      #   2) 아래 env의 ENABLE_TIER2: "0" 제거 (기본값 1로 동작)
      - run: python -m src.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TIER2: "0"
      - name: Commit snapshot
        run: |
          git config user.name  "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add data/state.json
          git diff --quiet --cached || git commit -m "chore: snapshot $(date -u +%F)"
          git push
